name: CampusCards Xcode tests

on:
  pull_request:
    paths:
      - 'CampusCards/**'
      - '.github/workflows/campuscards-xcode.yml'

permissions:
  contents: read

concurrency:
  group: campuscards-ios-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  simulator:
    name: ${{ matrix.device }} · iOS ${{ matrix.ios }} · Xcode ${{ matrix.xcode }}
    runs-on: macos-15
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - xcode: '16.4'
            ios: '18.5'
            device: iPhone 16 Pro
          - xcode: '26.2'
            ios: '26.2'
            device: iPhone 17 Pro
    env:
      DEVELOPER_DIR: /Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer
      IOS_VERSION: ${{ matrix.ios }}
      DEVICE_NAME: ${{ matrix.device }}
    steps:
      - uses: actions/checkout@v4
      - name: Boot the matching iOS Simulator
        id: simulator
        run: |
          sudo xcode-select --switch "$DEVELOPER_DIR"
          sudo xcodebuild -runFirstLaunch
          xcodebuild -version
          runtime="com.apple.CoreSimulator.SimRuntime.iOS-${IOS_VERSION//./-}"
          device_type="com.apple.CoreSimulator.SimDeviceType.${DEVICE_NAME// /-}"
          xcrun simctl list runtimes
          if ! xcrun simctl list runtimes --json | jq -e --arg runtime "$runtime" 'any(.runtimes[]; .identifier == $runtime and .isAvailable)' >/dev/null; then
            xcodebuild -downloadPlatform iOS -buildVersion "$IOS_VERSION"
          fi
          udid=$(xcrun simctl create "CampusCards $DEVICE_NAME" "$device_type" "$runtime")
          xcrun simctl bootstatus "$udid" -b
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
      - name: Prepare bundled speech resources
        run: python3 CampusCards/Scripts/prepare_offline_speech.py
      - name: Run CampusCards on iPhone Simulator
        working-directory: CampusCards
        run: |
          xcodebuild -project CampusCards.xcodeproj -scheme CampusCards \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
            -parallel-testing-enabled NO -resultBundlePath "$RUNNER_TEMP/CampusCards.xcresult" \
            ARCHS=arm64 test
      - name: Share the tested Xcode project with bundled speech resources
        if: matrix.xcode == '26.2'
        uses: actions/upload-artifact@v4
        with:
          name: CampusCards-Xcode
          path: CampusCards/
          retention-days: 7
      - name: Save XCTest results and transcripts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CampusCards-xcresult-iOS-${{ matrix.ios }}
          path: ${{ runner.temp }}/CampusCards.xcresult
          if-no-files-found: ignore
